name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # allow manual runs from the Actions tab
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    env:
      # Empty until the Azure Static Web App exists and its token is added as a repo
      # secret. Until then the build and verification steps still run - only the deploy
      # is skipped, so CI stays green and useful from the first commit.
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The .NET project is not shipped - it is the correctness harness. It compiles every
      # lesson and captures real output, so the site can never show output the code does
      # not produce. A lesson that fails to build or throws stops the deployment here.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify every lesson compiles
        run: dotnet build --configuration Release

      - name: Verify every lesson runs
        run: dotnet run --project src/LearnCSharp.Lessons -- all > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build site
        run: npm run build
        working-directory: web

      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web/dist
          # No api_location on purpose: adding an API is what takes this off the free tier.
          api_location: ''
          skip_app_build: true

      - name: Deployment skipped
        if: env.SWA_TOKEN == ''
        run: |
          echo "::notice::Site built successfully but was not deployed."
          echo "::notice::Create an Azure Static Web App on the Free plan, then add its"
          echo "::notice::deployment token as the AZURE_STATIC_WEB_APPS_API_TOKEN secret."

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close staging environment
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
