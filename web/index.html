<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Learn C# from your first Console.WriteLine to threads, LINQ and Dijkstra's algorithm. For GCSE and A-Level students, and developers coming from another language."
    />
    <title>Learn C#</title>
  </head>
  <body>
    <script>
      // Applied inline, before React loads, so the page never flashes the wrong theme.
      try {
        var theme = localStorage.getItem('learncsharp.theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
